<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="297mm" height="210mm" viewBox="0 0 297 210">
  <title>Camera calibration checkerboard: 9x6 inner corners, 25 mm squares</title>
  <desc>A4 landscape page. Checkerboard is 10 by 7 squares, centered, with each square exactly 25 mm.</desc>

  <!-- White A4 page background -->
  <rect x="0" y="0" width="297" height="210" fill="#ffffff"/>

  <!--
    Board size: 250 x 175 mm
    Board origin: (23.5, 17.5) mm
    Pattern: 10 columns x 7 rows = 9 x 6 inner corners
  -->
  <g id="checkerboard" shape-rendering="crispEdges">
    <rect x="23.5" y="17.5" width="250" height="175" fill="#ffffff"/>

    <!-- Row 1 -->
    <rect x="23.5"  y="17.5" width="25" height="25" fill="#000000"/>
    <rect x="73.5"  y="17.5" width="25" height="25" fill="#000000"/>
    <rect x="123.5" y="17.5" width="25" height="25" fill="#000000"/>
    <rect x="173.5" y="17.5" width="25" height="25" fill="#000000"/>
    <rect x="223.5" y="17.5" width="25" height="25" fill="#000000"/>
    <!-- Row 2 -->
    <rect x="48.5"  y="42.5" width="25" height="25" fill="#000000"/>
    <rect x="98.5"  y="42.5" width="25" height="25" fill="#000000"/>
    <rect x="148.5" y="42.5" width="25" height="25" fill="#000000"/>
    <rect x="198.5" y="42.5" width="25" height="25" fill="#000000"/>
    <rect x="248.5" y="42.5" width="25" height="25" fill="#000000"/>
    <!-- Row 3 -->
    <rect x="23.5"  y="67.5" width="25" height="25" fill="#000000"/>
    <rect x="73.5"  y="67.5" width="25" height="25" fill="#000000"/>
    <rect x="123.5" y="67.5" width="25" height="25" fill="#000000"/>
    <rect x="173.5" y="67.5" width="25" height="25" fill="#000000"/>
    <rect x="223.5" y="67.5" width="25" height="25" fill="#000000"/>
    <!-- Row 4 -->
    <rect x="48.5"  y="92.5" width="25" height="25" fill="#000000"/>
    <rect x="98.5"  y="92.5" width="25" height="25" fill="#000000"/>
    <rect x="148.5" y="92.5" width="25" height="25" fill="#000000"/>
    <rect x="198.5" y="92.5" width="25" height="25" fill="#000000"/>
    <rect x="248.5" y="92.5" width="25" height="25" fill="#000000"/>
    <!-- Row 5 -->
    <rect x="23.5"  y="117.5" width="25" height="25" fill="#000000"/>
    <rect x="73.5"  y="117.5" width="25" height="25" fill="#000000"/>
    <rect x="123.5" y="117.5" width="25" height="25" fill="#000000"/>
    <rect x="173.5" y="117.5" width="25" height="25" fill="#000000"/>
    <rect x="223.5" y="117.5" width="25" height="25" fill="#000000"/>
    <!-- Row 6 -->
    <rect x="48.5"  y="142.5" width="25" height="25" fill="#000000"/>
    <rect x="98.5"  y="142.5" width="25" height="25" fill="#000000"/>
    <rect x="148.5" y="142.5" width="25" height="25" fill="#000000"/>
    <rect x="198.5" y="142.5" width="25" height="25" fill="#000000"/>
    <rect x="248.5" y="142.5" width="25" height="25" fill="#000000"/>
    <!-- Row 7 -->
    <rect x="23.5"  y="167.5" width="25" height="25" fill="#000000"/>
    <rect x="73.5"  y="167.5" width="25" height="25" fill="#000000"/>
    <rect x="123.5" y="167.5" width="25" height="25" fill="#000000"/>
    <rect x="173.5" y="167.5" width="25" height="25" fill="#000000"/>
    <rect x="223.5" y="167.5" width="25" height="25" fill="#000000"/>
  </g>
</svg>
